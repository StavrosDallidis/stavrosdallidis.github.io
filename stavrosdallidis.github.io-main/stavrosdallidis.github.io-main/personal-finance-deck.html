<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Finance &amp; Investing — For the Individual Investor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --navy:#0a1628;
  --navy2:#0f2340;
  --ink:#111826;
  --slate:#5b6b7f;
  --line:#dbe1e9;
  --paper:#ffffff;
  --bg:#eceff4;
  --gold:#12368f;      /* imperial blue (primary accent) */
  --gold2:#1d4ed8;     /* brighter imperial blue */
  --accent:#1a3a8f;
  --accent2:#2f6fd0;
  --green:#1f6d4a;
  --red:#a32c2c;
  --shadow:0 24px 60px rgba(10,22,40,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Georgia","Times New Roman",serif;
  background:
    radial-gradient(1200px 600px at 80% -10%, #f6f8fb 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  overflow:hidden;
}
.app{height:100vh;display:flex;flex-direction:column}

/* Top bar */
.topbar{
  height:52px;flex:0 0 52px;
  background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);
  color:#fff;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:2px solid var(--gold);
  font-family:"Helvetica Neue",Arial,sans-serif;
}
.brand{display:flex;align-items:center;gap:12px;letter-spacing:.04em}
.brand .mark{
  width:26px;height:26px;border:1.5px solid var(--gold2);
  display:flex;align-items:center;justify-content:center;color:var(--gold2);
  font-weight:700;font-size:13px;border-radius:3px;
}
.brand .t{font-size:13px;font-weight:600;text-transform:uppercase}
.brand .sub{font-size:11px;color:#8aa0bb;text-transform:uppercase;letter-spacing:.12em}
.topmeta{font-size:11px;color:#9db2ca;letter-spacing:.1em;text-transform:uppercase}
.topright{display:flex;align-items:center;gap:16px}
.disclaimer-tag{font-family:"Helvetica Neue",Arial,sans-serif;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--gold2);padding:4px 10px;border-radius:20px;font-weight:700;white-space:nowrap}

/* Stage */
.stage{flex:1 1 auto;position:relative;display:flex;align-items:center;justify-content:center;padding:22px}
.slide{
  position:absolute;inset:22px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:10px;
  box-shadow:var(--shadow);
  opacity:0;transform:translateY(14px) scale(.995);
  transition:opacity .45s ease,transform .45s ease;
  pointer-events:none;overflow:hidden;display:flex;flex-direction:column;
}
.slide.active{opacity:1;transform:none;pointer-events:auto}
.slide-inner{flex:1;overflow-y:auto;padding:42px 56px}
.slide-inner::-webkit-scrollbar{width:9px}
.slide-inner::-webkit-scrollbar-thumb{background:#c7cfd9;border-radius:5px}

/* Slide accent rail */
.slide::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
  background:linear-gradient(180deg,var(--gold) 0%,var(--gold2) 100%);
}
.kicker{
  font-family:"Helvetica Neue",Arial,sans-serif;
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);
  font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;
}
.kicker::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
h1.title{font-size:40px;line-height:1.12;color:var(--navy);font-weight:700;letter-spacing:-.01em}
h2.title{font-size:30px;line-height:1.15;color:var(--navy);font-weight:700;margin-bottom:6px;letter-spacing:-.01em}
.lede{font-size:17px;color:var(--slate);line-height:1.55;margin-top:14px;max-width:60ch}
p.body{font-size:15.5px;line-height:1.62;color:var(--ink);margin-top:12px;max-width:66ch}
.muted{color:var(--slate)}
.hl{color:var(--gold);font-weight:700}
.hl-a{color:var(--accent);font-weight:700}

/* Cover */
.cover{display:flex;flex-direction:column;justify-content:center;height:100%;
  background:
   linear-gradient(180deg,rgba(10,22,40,.02),rgba(10,22,40,0)),
   var(--paper);
  padding:0 64px;position:relative;
}
.cover .eyebrow{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;letter-spacing:.28em;color:var(--gold);text-transform:uppercase;font-weight:700}
.cover h1{font-size:56px;line-height:1.05;color:var(--navy);margin:18px 0;font-weight:700;letter-spacing:-.02em}
.cover .sub{font-size:19px;color:var(--slate);max-width:58ch;line-height:1.5}
.cover .rule{width:120px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin:26px 0}
.cover .foot{position:absolute;bottom:40px;left:64px;right:64px;display:flex;justify-content:space-between;
  font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.cover .foot b{color:var(--navy)}
.watermark{position:absolute;right:-30px;bottom:-40px;font-size:280px;color:rgba(10,22,40,.03);font-weight:700;line-height:1;user-select:none}

/* Grid helpers */
.grid{display:grid;gap:20px;margin-top:22px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.card{
  background:#fbfcfd;border:1px solid var(--line);border-radius:9px;padding:20px 22px;position:relative;
}
.card h3{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;font-weight:700}
.card p{font-size:14px;line-height:1.55;color:var(--ink)}
.card .big{font-size:34px;color:var(--navy);font-weight:700;font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em}
.card.dark{background:linear-gradient(160deg,var(--navy),var(--navy2));border-color:var(--navy2);color:#dfe7f0}
.card.dark h3{color:var(--gold2)}
.card.dark p{color:#c4d2e2}
.card.dark .big{color:#fff}
.card .quote{font-family:"Georgia",serif;font-style:italic;color:var(--gold);font-size:14.5px;line-height:1.5;margin:8px 0 4px}
.card.dark .quote{color:var(--gold2)}
/* clickable contents cards */
.card.clickable{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.card.clickable:hover{border-color:var(--accent2);box-shadow:0 10px 26px rgba(10,22,40,.13);transform:translateY(-2px)}
.card.clickable:hover h3{color:var(--gold2)}
.card.clickable::after{content:"\2192";position:absolute;top:16px;right:18px;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:var(--line);font-size:16px;transition:color .15s,transform .15s}
.card.clickable:hover::after{color:var(--gold2);transform:translateX(3px)}

/* Definition list style */
.deflist{margin-top:20px;display:flex;flex-direction:column;gap:2px}
.defrow{display:flex;gap:0;border-bottom:1px solid var(--line);padding:14px 0;align-items:baseline}
.defrow:last-child{border-bottom:none}
.defterm{flex:0 0 210px;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;font-size:14px;color:var(--navy);letter-spacing:.01em}
.defdesc{flex:1;font-size:14.5px;line-height:1.55;color:var(--ink)}
.defrow .num{color:var(--gold);font-weight:700;margin-right:10px;font-family:"Helvetica Neue",Arial,sans-serif}

/* Callout */
.callout{margin-top:22px;border-left:4px solid var(--gold);background:#faf6ee;padding:16px 20px;border-radius:0 8px 8px 0}
.callout.accent{border-color:var(--accent);background:#f0f6fb}
.callout .lab{font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.callout.accent .lab{color:var(--accent)}
.callout p{font-size:14.5px;line-height:1.55}

/* Chips / stat strip */
.statstrip{display:flex;gap:0;margin-top:24px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stat{flex:1;padding:20px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:none}
.stat .v{font-family:"Helvetica Neue",Arial,sans-serif;font-size:30px;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.stat .v.gold{color:var(--gold)}
.stat .l{font-size:12px;color:var(--slate);margin-top:6px;line-height:1.35}

/* Interactive controls */
.tool{margin-top:22px;background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:20px}
.tool.split{grid-template-columns:340px 1fr;align-items:stretch}
.controls{display:flex;flex-direction:column;gap:18px}
.field label{display:flex;justify-content:space-between;font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px;letter-spacing:.02em}
.field label .val{color:var(--gold);font-weight:700}
input[type=range]{
  -webkit-appearance:none;width:100%;height:5px;border-radius:5px;
  background:linear-gradient(90deg,var(--gold) 0%,var(--gold) var(--fill,50%),#e3e8ee var(--fill,50%));
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--navy);border:3px solid #fff;box-shadow:0 2px 6px rgba(10,22,40,.35);cursor:pointer;
}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--navy);border:3px solid #fff;cursor:pointer}
.readout{display:flex;flex-direction:column;gap:12px;justify-content:center}
.readout .rline{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line)}
.readout .rline:last-child{border-bottom:none}
.readout .rk{font-size:13.5px;color:var(--slate)}
.readout .rv{font-family:"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:700;color:var(--navy)}
.readout .rv.gold{color:var(--gold)}
.readout .rv.green{color:var(--green)}
.readout .rv.red{color:var(--red)}
.chartbox{background:#fff;border:1px solid var(--line);border-radius:9px;padding:14px;min-height:230px;position:relative}
.chartwrap{position:relative;height:250px}
.chartwrap.tall{height:300px}

/* Quiz */
.quiz{margin-top:22px;background:#fbfcfd;border:1px solid var(--line);border-radius:10px;padding:24px}
.quiz .q{font-size:16px;color:var(--navy);font-weight:600;line-height:1.5;margin-bottom:16px;font-family:"Helvetica Neue",Arial,sans-serif}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  text-align:left;font-family:"Helvetica Neue",Arial,sans-serif;font-size:14.5px;
  padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);
  cursor:pointer;transition:all .18s;display:flex;align-items:center;gap:12px;
}
.opt:hover{border-color:var(--accent);background:#f6fafe}
.opt .k{width:24px;height:24px;flex:0 0 24px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--slate)}
.opt.correct{border-color:var(--green);background:#eef7f2}
.opt.correct .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:#fbeeee}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.quiz-fb{margin-top:14px;font-size:14px;line-height:1.55;color:var(--slate);min-height:20px}
.quiz-fb b{color:var(--navy)}

/* relationship diagram */
.relation{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-top:8px}
.rnode{background:#fff;border:1px solid var(--line);border-radius:9px;padding:16px 18px;text-align:center}
.rnode .rt{font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;color:var(--navy);font-size:15px}
.rnode .rd{font-size:12.5px;color:var(--slate);margin-top:6px;line-height:1.4}
.rarrow{color:var(--gold);font-size:26px;font-weight:700}
/* linear flow (3 nodes in one row) */
.flow{display:flex;align-items:stretch;gap:12px;margin-top:20px}
.flow .rnode{flex:1;display:flex;flex-direction:column;justify-content:center}
.flow .rarrow{display:flex;align-items:center;justify-content:center;flex:0 0 auto}

/* footer nav */
.navbar{
  height:56px;flex:0 0 56px;background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  font-family:"Helvetica Neue",Arial,sans-serif;
}
.progresswrap{flex:1;margin:0 22px;height:4px;background:#e6eaef;border-radius:3px;overflow:hidden}
.progressbar{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
.navbtn{
  display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--navy);
  background:#f4f6f9;border:1px solid var(--line);border-radius:7px;padding:9px 16px;cursor:pointer;transition:.15s;
}
.navbtn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.navbtn:disabled{opacity:.35;cursor:default}
.navbtn:disabled:hover{background:#f4f6f9;color:var(--navy)}
.counter{font-size:12px;color:var(--slate);letter-spacing:.1em;min-width:78px;text-align:center}
.counter b{color:var(--navy)}

/* section divider slide */
.divider{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 64px;
  background:linear-gradient(150deg,var(--navy) 0%,var(--navy2) 60%,#123056 100%);color:#fff;position:relative}
.divider::before{background:linear-gradient(180deg,var(--gold),var(--gold2))}
.divider .snum{font-family:"Helvetica Neue",Arial,sans-serif;font-size:15px;letter-spacing:.3em;color:var(--gold2);text-transform:uppercase}
.divider h1{font-size:48px;margin:16px 0;line-height:1.08;color:#fff;font-weight:700;letter-spacing:-.01em}
.divider p{font-size:17px;color:#b8c8db;max-width:56ch;line-height:1.55}
.divider .dots{margin-top:30px;display:flex;gap:8px}
.divider .dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25)}
.divider .dots span.on{background:var(--gold2)}

/* tiny table */
table.mini{width:100%;border-collapse:collapse;margin-top:18px;font-family:"Helvetica Neue",Arial,sans-serif}
table.mini th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--slate);text-align:left;padding:10px 12px;border-bottom:2px solid var(--line)}
table.mini td{font-size:14px;padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink)}
table.mini tr:last-child td{border-bottom:none}
table.mini td.num{font-family:"Helvetica Neue",Arial,sans-serif;text-align:right;font-variant-numeric:tabular-nums}
table.mini .pos{color:var(--green);font-weight:600}
table.mini .neg{color:var(--red);font-weight:600}
.pill{display:inline-block;font-family:"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.04em}
.pill.g{background:#e7f3ec;color:var(--green)}
.pill.r{background:#fbeaea;color:var(--red)}
.pill.n{background:#eaf1f8;color:var(--accent)}

.note{font-size:12px;color:var(--slate);margin-top:14px;font-style:italic}
.src{position:absolute;bottom:14px;right:24px;font-size:10.5px;color:#a9b4c1;font-family:"Helvetica Neue",Arial,sans-serif;letter-spacing:.04em}

.toggle-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.tg{font-family:"Helvetica Neue",Arial,sans-serif;font-size:12px;font-weight:600;padding:7px 14px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--slate);cursor:pointer;transition:.15s}
.tg.on{background:var(--navy);color:#fff;border-color:var(--navy)}

@media (max-width:1080px){
  .tool.split{grid-template-columns:1fr}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
}
</style>
</head>

    <h1>Personal Finance &amp;<br>Investing</h1>
    <div class="rule"></div>
    <div class="sub">The core money mechanics every person should understand and master in order to start investing — time value of money, inflation, saving, credit — <span class="hl">plus a full primer on the instruments themselves: stocks, bonds, funds, ETFs and portfolio building.</span> Interactive throughout.</div>
    <div class="foot">

<!-- 2. AGENDA / COURSE MAP -->
<section class="slide" data-section="Introduction">
  <div class="slide-inner">
    <div class="kicker">Course Map</div>
    <h2 class="title">What will be covered</h2>
    <p class="lede">This work aims to make investing, personal finance, and key economic concepts more accessible to people who have little or no prior knowledge of these subjects. Through interactive examples, it seeks to simplify complex ideas and provide readers with a hands-on environment where they can explore how different financial decisions and economic scenarios influence their long-term wealth-building journey. Thank you for taking the time to read this work. If you notice any errors, inaccuracies, or areas that could be improved or expanded, please feel free to get in touch. Your feedback is greatly appreciated.</p>
    <div class="grid g3" id="agendaGrid">
      <div class="card"><h3>01 · Foundations</h3><p>Financial literacy, the planning process, the financial system, supervision, and the five kinds of risk.</p></div>
      <div class="card"><h3>02 · Career &amp; Income</h3><p>Your earning power — job vs career, the skills gap, buying-power and tax-equivalent benefits.</p></div>
      <div class="card"><h3>03 · Time Value of Money</h3><p>Why a euro today beats a euro tomorrow — the single most important idea in finance.</p></div>
      <div class="card"><h3>04 · Interest &amp; Compounding</h3><p>The "eighth wonder": how the same rate grows wealth or destroys it.</p></div>
      <div class="card"><h3>05 · Inflation &amp; Money Mgmt</h3><p>The silent tax on cash, nominal vs real, plus balance sheets, cash flow and budgeting.</p></div>
      <div class="card"><h3>06 · Saving</h3><p>Institutions, account types, payments, deposit protection, and saving toward real goals.</p></div>
      <div class="card"><h3>07 · Consumer Credit</h3><p>Borrowing wisely, debt ratios, the 28/36 rule, credit scores and the true cost of a loan.</p></div>
      <div class="card"><h3>08 · Loan Amortization</h3><p>How installment loans and credit cards really work over time.</p></div>
      <div class="card"><h3>09 · Risk &amp; Return</h3><p>The trade-off at the heart of every investment, and diversification.</p></div>
      <div class="card"><h3>10 · Investing Basics</h3><p>From saving to investing: the menu of asset classes, the economy, and the market's rules.</p></div>
      <div class="card"><h3>11 · Stocks</h3><p>Owning a slice of a business — kinds of stock, dividends, total return, exchanges and indices.</p></div>
      <div class="card"><h3>12 · Bonds</h3><p>Lending for interest — ratings, yields, and the all-important price–rate seesaw.</p></div>
      <div class="card"><h3>13 · Funds &amp; ETFs</h3><p>Instant diversification, index vs managed, ETFs, dollar-cost averaging and the fee drag.</p></div>
      <div class="card"><h3>14 · Styles &amp; the Masters</h3><p>Value, growth &amp; technical — plus Graham, Buffett, Lynch and Bogle, and building a portfolio.</p></div>
      <div class="card"><h3>15 · Bringing it Together</h3><p>Start early, mind the rate, diversify and protect.</p></div>
    </div>
    <p class="note" style="text-align:center">Tip — click any module above to jump straight to it.</p>

    <h1>Foundations</h1>
    <p>Before instruments and returns: what financial literacy is, how a plan gets built, and the risks that quietly shape every decision.</p>
    <div class="dots"><span class="on"></span><span></span><span></span><span></span><span></span></div>

<!-- 4. WHAT IS FINANCIAL LITERACY -->
<section class="slide" data-section="Foundations">
  <div class="slide-inner">
    <div class="kicker">Definition</div>
    <h2 class="title">Financial literacy is more than knowing formulas</h2>
    <p class="lede">The OECD frames it as the blend of four things that let you use financial services safely and build lasting wellbeing.</p>
    <div class="grid g2">
      <div class="card"><h3>Knowledge</h3><p>"I understand how it works." Grasping concepts, tools and principles — e.g. that stocks carry more risk than bonds.</p></div>
      <div class="card"><h3>Skills</h3><p>"What I can do." Building a budget, comparing loan offers, using digital banking, planning for retirement.</p></div>
      <div class="card"><h3>Attitudes</h3><p>"How I feel about money." Valuing saving, being uneasy about debt, prizing financial independence.</p></div>
      <div class="card"><h3>Behaviours</h3><p>"What I actually do." Tracking spending, setting goals, and seeking advice when I need it.</p></div>
    </div>
    <div class="callout">
      <div class="lab">Why it matters</div>
      <p>In one Eurozone survey, only about <b>1 in 2 people</b> grasped risk diversification and just <b>44.7%</b> understood compound interest — the very concepts that separate good outcomes from bad ones.</p>
    </div>
  </div>
</section>

<!-- 5. THE PLANNING PROCESS -->
<section class="slide" data-section="Foundations">
  <div class="slide-inner">
    <div class="kicker">The Process</div>
    <h2 class="title">Personal financial planning, in six steps</h2>
    <p class="lede">Planning is a loop, not a line. You revisit it at least once a year — and whenever life changes.</p>
    <div class="deflist">
      <div class="defrow"><div class="defterm"><span class="num">1</span>Assess your position</div><div class="defdesc">Take stock of income, savings, living costs and debt. Know your starting point.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">2</span>Set financial goals</div><div class="defdesc">Decide what you're aiming for — and be honest about the feelings and pressures driving those goals.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">3</span>Identify alternatives</div><div class="defdesc">Continue, expand, change course, or take a wholly new path. "Doing nothing" is itself a risky choice.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">4</span>Evaluate alternatives</div><div class="defdesc">Weigh opportunity cost and risk. Every choice means giving something up — in money or in time.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">5</span>Create &amp; implement a plan</div><div class="defdesc">Turn goals into action: save more, spend less, earn more — and get help where needed.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">6</span>Review &amp; revise</div><div class="defdesc">Conditions change. Re-examine at least annually, and adjust to stay on track.</div></div>
    </div>
  </div>
</section>

<!-- 6. FIVE RISKS -->
<section class="slide" data-section="Foundations">
  <div class="slide-inner">
    <div class="kicker">Risk Awareness</div>
    <h2 class="title">Five risks behind every money decision</h2>
    <p class="lede">All decisions carry uncertainty. Naming these makes them manageable.</p>
    <div class="grid g3">
      <div class="card"><h3>Inflation risk</h3><p>Rising (or falling) prices change your buying power. Wait to buy, and it may cost more.</p></div>
      <div class="card"><h3>Interest-rate risk</h3><p>Changing rates affect what you pay when you borrow and earn when you save.</p></div>
      <div class="card"><h3>Income risk</h3><p>A job loss from shifting demand or technology can cut off your cash flow.</p></div>
      <div class="card"><h3>Personal risk</h3><p>Health, safety, and the hidden costs tied to particular purchases or choices.</p></div>
      <div class="card"><h3>Liquidity risk</h3><p>Higher-earning assets can be harder to convert to cash without losing value.</p></div>
      <div class="card dark"><h3>The takeaway</h3><p>You can't remove risk — but you can gather information, diversify, and hold an emergency buffer.</p></div>
    </div>
  </div>
</section>

<!-- 6b. THE FINANCIAL SYSTEM -->
<section class="slide" data-section="Foundations">
  <div class="slide-inner">
    <div class="kicker">The Big Picture</div>
    <h2 class="title">How money flows through the financial system</h2>
    <p class="lede">Your personal decisions sit inside a bigger machine. Savers supply funds, borrowers use them, intermediaries and markets connect the two — and regulators keep it honest.</p>
    <div class="flow">
      <div class="rnode"><div class="rt">Providers of funds</div><div class="rd">Individuals, businesses, governments — they earn interest &amp; dividends for the funds they supply.</div></div>
      <div class="rarrow">&#8594;</div>
      <div class="rnode"><div class="rt">Intermediaries &amp; markets</div><div class="rd">Banks, insurers, investment firms, and the stock, bond, money &amp; commodity markets.</div></div>
      <div class="rarrow">&#8594;</div>
      <div class="rnode"><div class="rt">Users of funds</div><div class="rd">Individuals, businesses, governments — they pay interest &amp; dividends for the funds they use.</div></div>
    </div>
    <div class="callout"><div class="lab">Economic factors that shape your plan</div><p>Consumer prices, interest rates, money supply, unemployment, GDP and stock indices all feed back into personal decisions. Rising prices erode buying power, while higher rates make borrowing dearer but saving more attractive.</p></div>
  </div>
</section>

<!-- 6c. WHO SUPERVISES YOUR MONEY -->
<section class="slide" data-section="Foundations">
  <div class="slide-inner">
    <div class="kicker">Supervision &amp; Protection</div>
    <h2 class="title">Who watches over your money?</h2>
    <p class="lede">Different pillars of your finances are overseen by different authorities. Knowing who does what tells you where to turn when something goes wrong. <span class="muted">(EU / Cyprus example.)</span></p>
    <div class="deflist">
      <div class="defrow"><div class="defterm">Bank deposits</div><div class="defdesc"><b>Central Bank</b> — supervises commercial banks and payment systems, and runs the deposit guarantee (up to €100,000 per depositor, per bank).</div></div>
      <div class="defrow"><div class="defterm">Investments</div><div class="defdesc"><b>Securities &amp; Exchange Commission (CySEC)</b> — regulates investment services, brokerages, collective schemes and funds under EU rules.</div></div>
      <div class="defrow"><div class="defterm">Insurance</div><div class="defdesc"><b>Insurance Control Service</b> (Ministry of Finance) — supervises insurance companies.</div></div>
      <div class="defrow"><div class="defterm">Pensions</div><div class="defdesc"><b>Ministry of Labour</b> — social-insurance (pillar 1) and occupational pensions (pillar 2), plus private products (pillar 3) via insurers or investment firms.</div></div>
      <div class="defrow"><div class="defterm">Consumer rights</div><div class="defdesc"><b>Consumer Protection Service</b>, plus an independent <b>Financial Ombudsman</b> that handles complaints against banks.</div></div>

<!-- 10. SIMPLE vs COMPOUND concept -->
<section class="slide" data-section="Interest & Compounding">
  <div class="slide-inner">
    <div class="kicker">Core Mechanic</div>
    <h2 class="title">Interest is the price of money</h2>
    <p class="lede">It's the growth rate of your savings and, equally, the growth rate of your debt. Compounding means earning interest on interest.</p>
    <div class="grid g2">
      <div class="card">
        <h3>Simple interest</h3>
        <p class="big">€515</p>
        <p class="muted">€500 at 6% for one year earns €15 — interest only on the original principal.</p>
      </div>
      <div class="card dark">
        <h3>Compound formula</h3>
        <p class="big" style="font-family:Georgia,serif">F = P (1 + r)<sup>T</sup></p>
        <p>Final = Principal × (1 + rate) raised to the number of periods. This is exponential — and time is the exponent.</p>
      </div>
    </div>
    <div class="callout">
      <div class="lab">The famous line</div>
      <p>Asked for humanity's greatest discovery, the reply was reportedly <b>"compound interest."</b> Whether apocryphal or not, the maths agrees: $1 invested at 8% in 1789 would be worth roughly <b>$48.7 million</b> 230 years later.</p>
    </div>
  </div>
</section>

<!-- 13. HOW RATES AFFECT OTHER THINGS -->
<section class="slide" data-section="Interest & Compounding">
  <div class="slide-inner">
    <div class="kicker">Connections · How One Lever Moves Others</div>
    <h2 class="title">Interest rates ripple through everything</h2>
    <p class="lede">Rates aren't set in isolation. A single move by a central bank cascades across saving, borrowing, prices and asset values.</p>
    <div class="grid g2">
      <div class="card"><h3>Rates &#8593; &nbsp;&#8594;&nbsp; Borrowing</h3><p>Loans and mortgages get more expensive, and new borrowing slows. Existing variable-rate debt costs more each month.</p></div>
      <div class="card"><h3>Rates &#8593; &nbsp;&#8594;&nbsp; Saving</h3><p>Deposits and bonds pay more, making saving more attractive and often cooling consumer spending.</p></div>
      <div class="card"><h3>Inflation &#8593; &nbsp;&#8594;&nbsp; Rates</h3><p>When prices rise too fast, central banks lift rates to slow demand — the classic policy response.</p></div>
      <div class="card"><h3>Rates &#8593; &nbsp;&#8594;&nbsp; Asset prices</h3><p>Higher rates raise the "discount" on future cash flows, which tends to weigh on stock and property valuations.</p></div>
    </div>
    <div class="callout">
      <div class="lab">Timing rule of thumb</div>
      <p>When rates are <b>rising</b>: favour long-term loans (lock low) and short-term savings (reprice up). When rates are <b>falling</b>: favour short-term loans (refinance cheaper) and long-term savings (lock high).</p>
    </div>
  </div>
</section>

<!-- 17b. MONEY MANAGEMENT: STATEMENTS -->
<section class="slide" data-section="Money Management">
  <div class="slide-inner">
    <div class="kicker">Money Management</div>
    <h2 class="title">Two statements tell you where you stand</h2>
    <p class="lede">Good money management rests on two personal documents — a snapshot of what you own, and a record of what flows in and out.</p>
    <div class="grid g2">
      <div class="card"><h3>Personal balance sheet</h3><p>A snapshot on a given date. <b>Net worth = Assets − Liabilities.</b> Grow it by saving more, spending less, growing investments, or reducing what you owe.</p></div>
      <div class="card"><h3>Cash-flow statement</h3><p>Income in minus money out over a period, giving a surplus or deficit. It's the foundation for a realistic spending and saving plan.</p></div>
    </div>
    <div class="callout"><div class="lab">A warning sign</div><p><b>Insolvency</b> is when liabilities exceed assets — you can't pay debts as they fall due. Watching both statements over time catches trouble early. When applying for a loan, banks require exactly this data: monthly income and expenses, existing repayments, and your assets.</p></div>
  </div>
</section>

<!-- 17c. BUDGETING -->
<section class="slide" data-section="Money Management">
  <div class="slide-inner">
    <div class="kicker">Budgeting</div>
    <h2 class="title">A budget is a plan you actually follow</h2>
    <p class="lede">A budget helps you live within your income, spend deliberately, hit your goals, and prepare for emergencies. It only works if it's kept.</p>
    <div class="deflist">
      <div class="defrow"><div class="defterm"><span class="num">1</span>Set financial goals</div><div class="defdesc">Define what you're budgeting toward.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">2</span>Estimate income</div><div class="defdesc">Salary, self-employment, investment income, benefits, support.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">3</span>Budget emergency fund &amp; savings</div><div class="defdesc">Pay your future self first — before discretionary spending.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">4</span>Budget fixed expenses</div><div class="defdesc">Rent, insurance, loan payments — the costs you can't easily flex.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">5</span>Budget variable expenses</div><div class="defdesc">Groceries, utilities, leisure — where you have room to adjust.</div></div>
      <div class="defrow"><div class="defterm"><span class="num">6–7</span>Record &amp; review</div><div class="defdesc">Track actual spending, then compare to plan and revise. A good budget is realistic, flexible and easy to explain.</div></div>
    </div>
  </div>
</section>

<!-- 19. EVALUATING SAVINGS PLANS -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">How to Choose</div>
    <h2 class="title">Six factors when weighing a savings plan</h2>
    <p class="lede">Every account trades some of these against the others. There's no single "best" — only best-for-your-goal.</p>
    <div class="grid g3">
      <div class="card"><h3>Rate of return</h3><p>The percentage your balance grows. Rises with more frequent compounding.</p></div>
      <div class="card"><h3>Inflation</h3><p>Higher prices erode the buying power of the interest you earn.</p></div>
      <div class="card"><h3>Taxes</h3><p>Taxable interest reduces your net earnings — check the after-tax yield.</p></div>
      <div class="card"><h3>Liquidity</h3><p>How easily you can withdraw. Locking money longer usually pays more.</p></div>
      <div class="card"><h3>Safety</h3><p>Deposit protection and the risk of losing principal or interest.</p></div>
      <div class="card"><h3>Restrictions &amp; fees</h3><p>Minimum-balance rules and charges that quietly eat returns.</p></div>
    </div>
    <div class="callout"><div class="lab">Deposit protection</div><p>Bank deposits are typically guaranteed up to <b>€100,000 per depositor, per bank</b>. But money-market <em>funds</em> are investments, not deposits — and are <b>not</b> covered by that guarantee.</p></div>
  </div>
</section>

<!-- 21b. TYPES OF FINANCIAL INSTITUTIONS -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">Where to Keep &amp; Grow Money</div>
    <h2 class="title">The main types of financial institution</h2>
    <p class="lede">Not all providers are the same. Deposit-takers protect your cash, while investment firms offer growth but not a deposit guarantee.</p>
    <div class="grid g2">
      <div class="card"><h3>Commercial banks</h3><p>Full-service: savings, loans, payments. Organised as companies, with your deposits covered by the state guarantee scheme.</p></div>
      <div class="card"><h3>Credit unions</h3><p>Member-owned, non-profit cooperatives. Studies show they often charge lower fees and lower loan rates, with higher satisfaction.</p></div>
      <div class="card"><h3>Life-insurance companies</h3><p>Provide financial security for dependents, and increasingly also offer savings, investment and retirement-planning products.</p></div>
      <div class="card"><h3>Investment companies (funds)</h3><p>Mutual funds and money-market funds combine saving and investing. <b>Not</b> deposits — so <b>not</b> covered by the deposit guarantee.</p></div>
    </div>
    <div class="callout accent"><div class="lab">Also worth knowing</div><p>Mortgage companies lend specifically for home purchase. Newer players include online-only banks and peer-to-peer (P2P) lending networks.</p></div>
  </div>
</section>

<!-- 21c. SAVINGS VEHICLES -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">Savings Vehicles</div>
    <h2 class="title">Four common ways to hold savings</h2>
    <div class="deflist">
      <div class="defrow"><div class="defterm">Savings account</div><div class="defdesc">Low or zero minimum balance, withdraw any time. Credit unions call these "share accounts." Maximum liquidity, modest return.</div></div>
      <div class="defrow"><div class="defterm">Certificate of deposit (CD)</div><div class="defdesc">Lock money for a set term for a higher rate, but early withdrawal triggers a penalty. A "ladder" of CDs maturing at different dates balances yield and access.</div></div>
      <div class="defrow"><div class="defterm">Money-market account</div><div class="defdesc">Requires a minimum balance, pays market rates. At a bank it's a covered <b>deposit</b>, whereas a money-market <b>fund</b> is an investment and is not covered.</div></div>
      <div class="defrow"><div class="defterm">Payment / current account</div><div class="defdesc">For day-to-day transactions — direct debits, salary, card purchases. Watch maintenance, inactivity, transaction and transfer fees.</div></div>
    </div>
    <div class="callout"><div class="lab">Opportunity cost is everywhere</div><p>A higher long-term rate usually costs you liquidity. A "free" current account requiring a €500 no-interest minimum quietly costs you the interest that €500 could have earned.</p></div>
  </div>
</section>

<!-- 21d. DIGITAL BANKING & PAYMENTS -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">Financial Services &amp; Payments</div>
    <h2 class="title">Banking has moved from the queue to the app</h2>
    <p class="lede">The way we access money has changed — from teller lines to a phone tap, from posted cheques to a photographed deposit.</p>
    <div class="grid g3">
      <div class="card"><h3>Payments &amp; transfers</h3><p>Online payments, moving funds between accounts, person-to-person transfers, and tap-to-pay purchases.</p></div>
      <div class="card"><h3>Deposits</h3><p>Direct deposit of pay, transfers from other accounts, and remote "photo" cheque deposits.</p></div>
      <div class="card"><h3>Other services</h3><p>Balance alerts, loan applications, rate comparisons, and buying, selling or monitoring investments.</p></div>
    </div>
    <div class="grid g2" style="margin-top:18px">
      <div class="card"><h3>The upside</h3><p>Convenience, time saved, and instant access to information — 24/7 via app, website or ATM, plus debit cards that spend your own money.</p></div>
      <div class="card"><h3>The trade-offs</h3><p>Privacy and data-security concerns, the ease of overspending, costly fees, and exposure to online fraud. Convenience must be weighed against cost.</p></div>
    </div>
  </div>
</section>

<!-- 21e. OTHER PAYMENT METHODS -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">Payment Methods</div>
    <h2 class="title">Beyond cash and card</h2>
    <p class="lede">Certain transactions call for guaranteed or specialised payment instruments. It pays to know which is which.</p>
    <div class="deflist">
      <div class="defrow"><div class="defterm">Certified cheque</div><div class="defdesc">A personal cheque the bank guarantees, with the amount removed from your balance when certified.</div></div>
      <div class="defrow"><div class="defterm">Cashier's cheque</div><div class="defdesc">Drawn on the bank itself — you pay the amount plus a fee. Treated as very secure by the recipient.</div></div>
      <div class="defrow"><div class="defterm">Money order</div><div class="defdesc">Bought from a bank, post office or store for smaller guaranteed payments.</div></div>
      <div class="defrow"><div class="defterm">Money-transfer services</div><div class="defdesc">Fast, convenient global transfers — e.g. Wise, Western Union, MoneyGram, Xoom.</div></div>
    </div>
    <div class="callout accent"><div class="lab">Stay alert to conditions</div><p>Rates and fees move with the economy. Track interest-rate trends before locking money away, and read the fee schedule before you open any account.</p></div>
  </div>
</section>

<!-- 21g. EMERGENCY FUND & COMMON MISTAKES -->
<section class="slide" data-section="Saving">
  <div class="slide-inner">
    <div class="kicker">Lessons from Common Mistakes</div>
    <h2 class="title">Why an emergency fund comes first</h2>
    <p class="lede">Before investing for growth, set aside accessible cash for the unexpected. It is what keeps one bad month from undoing months of good decisions.</p>
    <div class="grid g2">
      <div class="card"><h3>What an emergency fund does</h3><p>A car repair, a medical bill, or a sudden job loss can hit at any time. A buffer of accessible cash — with an emphasis on <b>access</b> — means you never have to abandon your plans or reach for expensive credit.</p></div>
      <div class="card dark"><h3>The rule</h3><p>Don't let emotions drive money decisions. Budget for the unexpected, not just for the fun, and keep the buffer liquid so you can actually use it when it counts.</p></div>
    </div>
    <div class="callout"><div class="lab">Common money-management mistakes</div><p>Overspending on impulse and heavy credit use, too few liquid assets for current bills, using savings or borrowing to cover everyday living costs, and failing to put money into a savings or investment plan that builds future income.</p></div>
  </div>
</section>

<!-- 23. CREDIT pros/cons + debt ratios -->
<section class="slide" data-section="Consumer Credit">
  <div class="slide-inner">
    <div class="kicker">Balance Sheet Discipline</div>
    <h2 class="title">Credit's two faces — and two guardrail ratios</h2>
    <div class="grid g2" style="margin-top:18px">
      <div class="card"><h3>What credit gives you</h3><p>Immediate access to goods, a cushion for emergencies, safety over cash, purchase protections and rewards — plus a record of financial stability.</p></div>
      <div class="card"><h3>What credit costs you</h3><p>Temptation to overspend, interest charges, and — if repayment fails — lost income, lost assets and a damaged reputation. Credit does <b>not</b> raise your total purchasing power.</p></div>
    </div>
    <div class="grid g2" style="margin-top:18px">
      <div class="card dark"><h3>Debt-payments-to-income</h3><p class="big">&lt; 20%</p><p>Monthly non-mortgage debt payments ÷ net monthly income. Keep it under one-fifth.</p></div>
      <div class="card dark"><h3>Debt-to-net-worth</h3><p class="big">&lt; 1.0</p><p>Total liabilities ÷ net worth (excluding home &amp; mortgage). Below one keeps you solvent.</p></div>
    </div>
  </div>
</section>

<!-- 23b. WHAT CREDIT IS + ALTERNATIVES -->
<section class="slide" data-section="Consumer Credit">
  <div class="slide-inner">
    <div class="kicker">Definitions &amp; Trade-offs</div>
    <h2 class="title">What credit is — and three ways to finance a purchase</h2>
    <p class="body"><span class="hl-a">Credit</span> is an agreement to receive cash, goods or services now and repay in the future. <span class="hl-a">Consumer credit</span> is using credit for personal needs (other than a mortgage). You borrow for education, cars, everyday spending, a business, or a home.</p>
    <div class="grid g3">
      <div class="card"><h3>Use savings</h3><p>But drawing them down shrinks your emergency cushion.</p></div>
      <div class="card"><h3>Use current income</h3><p>But spending on luxuries now reduces future wellbeing.</p></div>
      <div class="card"><h3>Borrow against future income</h3><p>But that commits tomorrow's money and reduces future flexibility.</p></div>
    </div>
    <div class="callout"><div class="lab">Before borrowing, ask yourself</div><p>Do I have the cash for a down-payment? Must I dip into savings? Does it fit my budget? Could I use the money better elsewhere? Can I delay the purchase — what's the opportunity cost? And what is the monetary <em>and</em> emotional cost of this debt?</p></div>
  </div>
</section>

<!-- 23c. WHAT THE BANK ASSESSES -->
<section class="slide" data-section="Consumer Credit">
  <div class="slide-inner">
    <div class="kicker">The Lender's View</div>
    <h2 class="title">What a bank checks before it lends</h2>
    <p class="lede">Under central-bank rules, lenders build a Personal Financial Statement and must disclose the loan's key terms up front.</p>
    <div class="grid g2">
      <div class="card"><h3>What they collect from you</h3><p>Monthly household income and expenses, current repayments on existing facilities (cards, car loans, mortgages, overdrafts), and your assets — property and movable wealth.</p></div>
      <div class="card"><h3>What they must disclose to you</h3><p>Currency, term and type of loan, the nominal rate and whether it's fixed or variable, collateral, the APRC (total cost), the number and size of payments, a repayment schedule, early-repayment rules and penalties, and the consequences of default.</p></div>
    </div>
    <div class="callout accent"><div class="lab">Guarantor beware</div><p>Co-signing makes you liable for the whole debt. Studies suggest <b>three in four guarantors</b> are eventually called to pay some or all of a loan they guaranteed. It can also block your own future borrowing.</p></div>
  </div>
</section>

<!-- 23d. 28/36 RULE + CREDIT SCORE FACTORS -->
<section class="slide" data-section="Consumer Credit">
  <div class="slide-inner">
    <div class="kicker">Capacity to Repay</div>
    <h2 class="title">The 28/36 rule and what moves your score</h2>
    <p class="lede">A widely used affordability guideline caps how much of your income should go to debt.</p>
    <div class="grid g2">
      <div class="card dark"><h3>28% — housing</h3><p>No more than 28% of gross income on total housing costs (mortgage, taxes, insurance).</p></div>
      <div class="card dark"><h3>36% — total debt</h3><p>No more than 36% of gross income on <b>all</b> debt payments combined.</p></div>
    </div>
    <p class="body" style="margin-top:18px">Lenders also build their own <span class="hl-a">credit score</span> from your data: income, outstanding balances, any late or missed payments, net worth and liquidity. A strong score earns you the best terms — including a lower rate.</p>
    <div class="callout"><div class="lab">Protecting your score</div><p>Borrow within your capacity, honour every contract, and check your record (e.g. via a credit registry). In some markets, non-performing loans and arrears are flagged directly to future lenders.</p></div>
  </div>
</section>

<!-- 24. CREDIT SCORE → INTEREST RATE -->
<section class="slide" data-section="Consumer Credit">
  <div class="slide-inner">
    <div class="kicker">Connections · Why Your Score Matters</div>
    <h2 class="title">A better credit score buys a lower rate</h2>
    <p class="lede">Lenders price risk. The higher your creditworthiness, the cheaper your money — and the effect compounds over a loan's life.</p>
    <div class="tool split">
      <div class="controls">
        <div class="field"><label>Credit score <span class="val" id="csScorev">720</span></label><input type="range" id="csScore" min="350" max="850" step="10" value="720"></div>
        <div class="field"><label>Loan amount <span class="val" id="csAmtv">€20,000</span></label><input type="range" id="csAmt" min="5000" max="80000" step="1000" value="20000"></div>

<!-- INV-2. WHAT INVESTING IS + THE MENU -->
<section class="slide" data-section="Investing Basics">
  <div class="slide-inner">
    <div class="kicker">From Saving to Investing</div>
    <h2 class="title">Investing is getting your money to make more money</h2>
    <p class="lede">That's the whole idea, in one line. The catch: growth comes with risk, and every asset class behaves differently. Your job is to match them to your goals.</p>
    <div class="grid g3">
      <div class="card"><h3>Stocks (equities)</h3><p>A share of ownership in a company. The biggest long-run returns — and the biggest swings.</p></div>
      <div class="card"><h3>Bonds</h3><p>A loan to a government or company that pays interest. Steadier, a counterweight to stocks.</p></div>
      <div class="card"><h3>Mutual funds</h3><p>A professionally managed basket of many securities — instant diversification for a small sum.</p></div>
      <div class="card"><h3>ETFs</h3><p>Index-tracking funds that trade like a stock, usually at very low cost.</p></div>
      <div class="card"><h3>Real estate</h3><p>Property directly, or via REITs — income plus a hedge against inflation.</p></div>
      <div class="card"><h3>Commodities &amp; metals</h3><p>Oil, wheat, gold — raw materials and precious metals, often held for diversification.</p></div>
    </div>
    <div class="callout"><div class="lab">Why not just save?</div><p>Cash slowly loses to inflation. Investing aims to <b>beat</b> it — accepting ups and downs in exchange for higher long-run growth. Currencies and cash equivalents round out the menu, but the six above are where most portfolios live.</p></div>
  </div>
</section>

<!-- INV-3. THE ECONOMY & YOU -->
<section class="slide" data-section="Investing Basics">
  <div class="slide-inner">
    <div class="kicker">Basic Economics</div>
    <h2 class="title">Investments don't grow in a vacuum</h2>
    <p class="lede">Consumer spending makes up most of GDP. When the economy grows, companies prosper and investments tend to follow. Savvy investors watch where it's heading — not just where it is.</p>
    <div class="grid g3">
      <div class="card"><h3>The economic cycle</h3><p>Downturn &#8594; recession &#8594; upturn &#8594; recovery, then round again. Different sectors lead at each stage ("sector rotation").</p></div>
      <div class="card"><h3>Leading indicators</h3><p>GDP, the consumer price index (CPI), unemployment, job growth and housing starts give clues to what's coming next.</p></div>
      <div class="card"><h3>Rates &amp; the central bank</h3><p>The Fed (or ECB) sets the tone. Lower rates lift stocks, while higher rates cool spending and can push share prices down.</p></div>
    </div>
    <div class="callout"><div class="lab">The rate connection (recall Module 04)</div><p>Cut rates &#8594; money supply up &#8594; stocks look more attractive. Hike rates &#8594; bonds pay more and future company cash flows get discounted harder &#8594; share prices can fall. It all links back to the price of money.</p></div>
  </div>
</section>

<!-- INV-4. WATCHDOGS & HOMEWORK -->
<section class="slide" data-section="Investing Basics">
  <div class="slide-inner">
    <div class="kicker">Rules of the Game</div>
    <h2 class="title">Regulators keep it fair — your job is the homework</h2>
    <div class="grid g2" style="margin-top:18px">
      <div class="card"><h3>The market watchdog</h3><p>The <b>SEC</b> in the US (CySEC / ESMA in Europe) enforces disclosure and licensing and polices <b>insider trading</b> — dealing on confidential, non-public information is illegal. Every listed company must file audited financials.</p></div>
      <div class="card"><h3>Do your homework</h3><p>Read the annual report past the glossy photos, use a research checklist, and <b>never</b> act on a "hot tip." An educated investor is a patient, relaxed investor.</p></div>
    </div>
    <div class="grid g2" style="margin-top:18px">
      <div class="card"><h3>Fundamental analysis</h3><p>Study the <b>company</b> — earnings, assets, book value, competitive position. Common among long-term, buy-and-hold investors.</p></div>
      <div class="card"><h3>Technical analysis</h3><p>Study the <b>price</b> — charts, patterns and volume. Used by shorter-term traders. Many pros combine both.</p></div>
    </div>
    <div class="src">Cagan, Investing 101 — Ch. 1 (Basic Economics) &amp; company fundamentals</div>
  </div>
</section>

<section class="slide" data-section="Stocks">

    <div class="kicker">Equities</div>
    <h2 class="title">A share is part-ownership of a company</h2>
    <p class="lede">That's why stocks are called <em>equities</em>. <b>Common stock</b> = ownership plus a vote. <b>Preferred stock</b> = a fixed dividend and payment priority, more bond-like, usually without a vote.</p>

        <tr><td>Mid cap</td><td>$2–10bn</td><td>Balance of growth and stability</td></tr>
        <tr><td>Small cap</td><td>$300m–2bn</td><td>Higher growth potential, more volatile</td></tr>
        <tr><td>Micro cap</td><td>&lt; $300m</td><td>Speculative, highest risk</td></tr>
      </tbody>
    </table>
    <div class="grid g3" style="margin-top:18px">
      <div class="card"><h3>Blue-chip</h3><p>Big, prestigious, long-established leaders. Conservative core holdings.</p></div>
      <div class="card"><h3>Growth</h3><p>Fast-growing, earnings reinvested rather than paid out. Shine in bull markets.</p></div>
      <div class="card"><h3>Income</h3><p>Pay steady, meaningful dividends — favoured for cash flow.</p></div>
      <div class="card"><h3>Value</h3><p>Cheap versus earnings/assets. Tend to hold up better in bear markets.</p></div>
      <div class="card"><h3>Cyclical</h3><p>Rise and fall with the economy (e.g. airlines, autos).</p></div>
      <div class="card"><h3>Defensive</h3><p>Stable through the cycle — food, drugs, utilities.</p></div>
    </div>
    <div class="callout"><div class="lab">Beware penny stocks</div><p>Shares selling for ≤ $5, often with little revenue and scant public information. High potential for loss — and a favourite of "hot tip" scams. For most people, not worth the risk.</p></div>

<!-- INV-10. WHAT BONDS ARE + WHY BUY -->
<section class="slide" data-section="Bonds">
  <div class="slide-inner">
    <div class="kicker">Fixed Income</div>
    <h2 class="title">Lending money for interest</h2>
    <p class="lede">You buy a bond at its <b>par (face) value</b> — often €1,000 — collect a set <b>coupon</b>, and get your principal back at <b>maturity</b>. Short (≤5 yrs), intermediate (7–10), or long (20–30).</p>
    <div class="grid g2">
      <div class="card"><h3>Why investors buy bonds</h3><p>They behave differently from stocks (diversification), pay a scheduled stream of income, return your principal at maturity, and some carry tax perks — e.g. municipal-bond interest is often tax-free.</p></div>
      <div class="card"><h3>The risks</h3><p><b>Credit/default risk</b> (the issuer can't pay), <b>interest-rate risk</b> (the price falls if you must sell after rates rise), and <b>inflation risk</b> (fixed payments buy less over time).</p></div>
    </div>
    <div class="callout"><div class="lab">Stock vs bond, in one line</div><p>A shareholder <b>owns</b> part of the company and rides its fortunes up and down. A bondholder has <b>lent</b> to it — collecting fixed interest and principal regardless of how well it does, unless it goes bankrupt.</p></div>
  </div>
</section>

<!-- INV-12. BOND TYPES -->
<section class="slide" data-section="Bonds">
  <div class="slide-inner">
    <div class="kicker">The Bond Menu</div>
    <h2 class="title">Five families of bonds</h2>
    <div class="deflist">
      <div class="defrow"><div class="defterm">Government (Treasuries)</div><div class="defdesc">Bills (≤1 yr), notes (2–10 yrs), bonds (30 yrs). Backed by the state — the safest, with interest often free of local tax. The benchmark "risk-free" rate.</div></div>
      <div class="defrow"><div class="defterm">Municipal ("munis")</div><div class="defdesc">Issued by cities/regions to fund public projects. Interest is frequently exempt from income tax — attractive to higher earners.</div></div>
      <div class="defrow"><div class="defterm">Corporate</div><div class="defdesc">Issued by companies. Higher yields than government debt, but they carry default risk and the income is fully taxable.</div></div>
      <div class="defrow"><div class="defterm">Junk / high-yield</div><div class="defdesc">Below investment grade. The biggest yields — and the biggest chance of default. Best held via a diversified fund.</div></div>
      <div class="defrow"><div class="defterm">Zero-coupon</div><div class="defdesc">Pay no periodic interest. Bought at a deep discount and redeemed at full face value — pure compounding in bond form.</div></div>
    </div>
    <div class="callout"><div class="lab">Laddering</div><p>Hold bonds maturing at staggered dates to balance yield with access and blunt interest-rate risk. Rule of thumb: keep the core high-quality — treasuries, munis and high-grade corporates.</p></div>
  </div>
</section>

  cur.textContent=idx+1;

  if(e.key==='ArrowLeft'||e.key==='PageUp'){show(idx-1);}
});

/* ============ FORMAT HELPERS ============ */
const eur = n => '€'+Math.round(n).toLocaleString('en-US');
const eur2 = n => '€'+n.toLocaleString('en-US',{maximumFractionDigits:0});
const pct = n => (Math.round(n*100)/100)+'%';
function fillTrack(el){
  const min=+el.min, max=+el.max, v=+el.value;
  el.style.setProperty('--fill',((v-min)/(max-min)*100)+'%');
}
document.querySelectorAll('input[type=range]').forEach(fillTrack);
document.querySelectorAll('input[type=range]').forEach(el=>el.addEventListener('input',()=>fillTrack(el)));

/* PMT for an ordinary annuity that reaches FV with 0 PV */
function pmtForFV(fv, r, n){ if(r===0) return fv/n; return fv * r / (Math.pow(1+r,n)-1); }
/* Loan payment (amortizing) */
function loanPmt(P, r, n){ if(r===0) return P/n; return P*r/(1-Math.pow(1+r,-n)); }

/* ============ CHART DEFAULTS ============ */
if(window.Chart){
  Chart.defaults.font.family="'Helvetica Neue',Arial,sans-serif";

const NAVY='#0a1628', GOLD='#12368f', GOLD2='#1d4ed8', ACC='#2f6fd0', GREEN='#1f6d4a', RED='#a32c2c', SLATE='#94a2b6';

function initFor(i){ /* charts self-init on load below */ }

/* -------- Rule of 72 -------- */
(function(){
  const r=document.getElementById('r72'); if(!r) return;
  const v=document.getElementById('r72v'), yrs=document.getElementById('r72years'),
        ex=document.getElementById('r72exact'), e1=document.getElementById('r72echo'), e2=document.getElementById('r72echo2');
  let chart;
  function draw(){
    const rate=+r.value;
    v.textContent=rate+'%';

/* -------- Compound calculator -------- */
(function(){
  const P=document.getElementById('ciP'); if(!P) return;

(function(){

(function(){

(function(){
  const B=document.getElementById('ccBal'); if(!B) return;
  const Apr=document.getElementById('ccApr'),Pay=document.getElementById('ccPay');
  const Bv=document.getElementById('ccBalv'),Av=document.getElementById('ccAprv'),Pv=document.getElementById('ccPayv');
  const time=document.getElementById('ccTime'),intt=document.getElementById('ccInt'),stat=document.getElementById('ccStatus');
  let chart;
  function draw(){
    const bal0=+B.value,apr=+Apr.value/100,pay=+Pay.value;
    Bv.textContent=eur(bal0);Av.textContent=(+Apr.value)+'%';Pv.textContent=eur(pay);
    [B,Apr,Pay].forEach(fillTrack);
    const mr=apr/12;
    const firstInterest=bal0*mr;
    const labels=[],bals=[];
    let bal=bal0,months=0,totalInt=0;
    labels.push(0);bals.push(bal);
    if(pay<=firstInterest){
      time.textContent='Never';intt.textContent='∞';
      stat.textContent='Balance never falls';stat.className='rv red';
      for(let m=1;m<=60;m++){bal=bal+bal*mr-pay;labels.push(m);bals.push(Math.max(bal,0));}
    } else {
      while(bal>0 && months<600){const i=bal*mr;totalInt+=i;bal=bal+i-pay;months++;labels.push(months);bals.push(Math.max(bal,0));}
      const yy=Math.floor(months/12),mm=months%12;
      time.textContent=(yy>0?yy+' yr ':'')+mm+' mo';
      intt.textContent=eur(totalInt);
      stat.textContent= months>120?'Very slow payoff':'On track'; stat.className='rv '+(months>120?'red':'');
    }
    if(!chart){
      chart=new Chart(document.getElementById('ccChart'),{
        type:'line',
        data:{labels,datasets:[{label:'Balance',data:bals,borderColor:RED,backgroundColor:'rgba(163,44,44,.10)',fill:true,borderWidth:2.5,pointRadius:0,tension:.15}]},

(function(){
  const C=document.getElementById('bsCoupon'); if(!C) return;
  const M=document.getElementById('bsMkt'),Y=document.getElementById('bsYrs');
  const Cv=document.getElementById('bsCouponv'),Mv=document.getElementById('bsMktv'),Yv=document.getElementById('bsYrsv');
  const priceEl=document.getElementById('bsPrice'),premEl=document.getElementById('bsPrem');
  const FACE=1000;
  let chart;
  function priceAt(couponR, mktR, n){
    const coupon=FACE*couponR;
    if(mktR===0) return coupon*n + FACE;
    return coupon*(1-Math.pow(1+mktR,-n))/mktR + FACE*Math.pow(1+mktR,-n);
  }
  function draw(){
    const c=+C.value/100, m=+M.value/100, n=+Y.value;
    Cv.textContent=(+C.value)+'%';Mv.textContent=(+M.value)+'%';Yv.textContent=n;
    [C,M,Y].forEach(fillTrack);
    const price=priceAt(c,m,n);
    priceEl.textContent=eur(price);
    const diff=price-FACE;
    if(Math.abs(diff)<1){ premEl.textContent='At par'; premEl.className='rv'; }
    else if(diff>0){ premEl.textContent='+'+eur(diff)+' · premium'; premEl.className='rv green'; }
    else { premEl.textContent='−'+eur(-diff)+' · discount'; premEl.className='rv red'; }
    const labels=[],data=[];
    for(let mr=1;mr<=12;mr+=0.5){ labels.push(mr+'%'); data.push(priceAt(c,mr/100,n)); }
    if(!chart){
      chart=new Chart(document.getElementById('bsChart'),{
        type:'line',
        data:{labels,datasets:[
          {label:'Price of your bond',data,borderColor:GOLD,backgroundColor:'rgba(29,78,216,.10)',fill:true,borderWidth:2.5,pointRadius:0,tension:.2},

        options:baseOpts({plugins:{legend:{display:true,position:'top',labels:{boxWidth:10,font:{size:10}}},tooltip:{callbacks:{title:c=>'Market rate '+c[0].label,label:c=>c.dataset.label+': '+eur(c.parsed.y)}}},
          scales:{x:{grid:{display:false},title:{display:true,text:'Prevailing market rate'}},y:{ticks:{callback:v=>'€'+Math.round(v)}}}})
      });
    } else { chart.data.datasets[0].data=data; chart.data.datasets[1].data=labels.map(()=>FACE); chart.update('none'); }

})();

  const Cur=document.getElementById('gbCur'); if(!Cur) return;
  const Home=document.getElementById('gbHome'),New=document.getElementById('gbNew'),Offer=document.getElementById('gbOffer');
  const Cv=document.getElementById('gbCurv'),Hv=document.getElementById('gbHomev'),Nv=document.getElementById('gbNewv'),Ov=document.getElementById('gbOfferv');
  const needEl=document.getElementById('gbNeeded'),verd=document.getElementById('gbVerdict');
  let chart;
  function draw(){
    const cur=+Cur.value,home=+Home.value,nw=+New.value,offer=+Offer.value;
    Cv.textContent=eur(cur);Hv.textContent=home;Nv.textContent=nw;Ov.textContent=eur(offer);
    [Cur,Home,New,Offer].forEach(fillTrack);
    const needed=cur*nw/home;
    needEl.textContent=eur(needed);
    const diff=offer-needed;
    verd.textContent=(diff>=0?'+':'−')+eur(Math.abs(diff))+' · '+(diff>=0?'worth it':'worse off');
    verd.className='rv '+(diff>=0?'green':'red');
    const labels=['Current salary','Needed to match','Offer'];
    const data=[cur,needed,offer];
    const cols=[SLATE,GOLD,diff>=0?GREEN:RED];
    if(!chart){
      chart=new Chart(document.getElementById('gbChart'),{
        type:'bar',
        data:{labels,datasets:[{data,backgroundColor:cols,borderRadius:4}]},
        options:baseOpts({plugins:{tooltip:{callbacks:{label:c=>eur(c.parsed.y)}}},
          scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{ticks:{callback:v=>'€'+(v>=1000?(v/1000).toFixed(0)+'k':v)}}}})
      });
    } else { chart.data.datasets[0].data=data; chart.data.datasets[0].backgroundColor=cols; chart.update('none'); }
  }
  [Cur,Home,New,Offer].forEach(e=>e.addEventListener('input',draw)); draw();
})();

/* -------- Tax-equivalent benefit -------- */
(function(){
  const Ben=document.getElementById('teBen'); if(!Ben) return;
  const Rate=document.getElementById('teRate');
  const Bv=document.getElementById('teBenv'),Rv=document.getElementById('teRatev');
  const val=document.getElementById('teVal'),bonus=document.getElementById('teBonus');
  let chart;
  function draw(){
    const ben=+Ben.value,rate=+Rate.value/100;
    Bv.textContent=eur(ben);Rv.textContent=(+Rate.value)+'%';
    [Ben,Rate].forEach(fillTrack);
    const eq= rate>=1? ben : ben/(1-rate);
    val.textContent=eur(eq);bonus.textContent=eur(eq-ben);
    const data=[ben, eq-ben];
    if(!chart){
      chart=new Chart(document.getElementById('teChart'),{
        type:'doughnut',
        data:{labels:['Benefit value','Extra tax you\'d owe on cash'],datasets:[{data,backgroundColor:[GREEN,GOLD],borderColor:'#fff',borderWidth:2}]},
        options:{responsive:true,maintainAspectRatio:false,cutout:'60%',
          plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11},padding:12}},
            tooltip:{callbacks:{label:c=>c.label+': '+eur(c.parsed)}}}}
      });
    } else { chart.data.datasets[0].data=data; chart.update('none'); }
  }
  [Ben,Rate].forEach(e=>e.addEventListener('input',draw)); draw();
})();

/* -------- Deposit guarantee -------- */
(function(){
  const A=document.getElementById('dgA'); if(!A) return;
  const B=document.getElementById('dgB'),H=document.getElementById('dgH');
  const Av=document.getElementById('dgAv'),Bv=document.getElementById('dgBv'),Hv=document.getElementById('dgHv');
  const pA=document.getElementById('dgProtA'),pB=document.getElementById('dgProtB'),tot=document.getElementById('dgTotal'),risk=document.getElementById('dgRisk');
  const LIMIT=100000;
  let chart;
  function draw(){
    const a=+A.value,b=+B.value,h=+H.value;
    Av.textContent=eur(a);Bv.textContent=eur(b);Hv.textContent=h;
    [A,B,H].forEach(fillTrack);
    const protA=Math.min(a/h,LIMIT)*h;
    const protB=Math.min(b/h,LIMIT)*h;
    const totalProt=protA+protB, atRisk=(a+b)-totalProt;
    pA.textContent=eur(protA);pB.textContent=eur(protB);tot.textContent=eur(totalProt);risk.textContent=eur(atRisk);
    if(!chart){
      chart=new Chart(document.getElementById('dgChart'),{
        type:'bar',
        data:{labels:['Bank A','Bank B'],datasets:[
          {label:'Protected',data:[protA,protB],backgroundColor:GREEN,stack:'s',borderRadius:2},
          {label:'At risk',data:[a-protA,b-protB],backgroundColor:RED,stack:'s',borderRadius:2}
        ]},
        options:baseOpts({plugins:{legend:{display:true,position:'top',labels:{boxWidth:10,font:{size:10}}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+eur(c.parsed.y)}}},
          scales:{x:{stacked:true,grid:{display:false}},y:{stacked:true,ticks:{callback:v=>'€'+(v>=1000?(v/1000).toFixed(0)+'k':v)}}}})
      });
    } else { chart.data.datasets[0].data=[protA,protB]; chart.data.datasets[1].data=[a-protA,b-protB]; chart.update('none'); }
  }
  [A,B,H].forEach(e=>e.addEventListener('input',draw)); draw();
})();

/* -------- Clickable contents / table of contents -------- */
(function(){
  const agenda = slides.find(s=>s.querySelector('#agendaGrid'));
  if(!agenda) return;
  const cards = Array.prototype.slice.call(agenda.querySelectorAll('#agendaGrid .card'));
  const dividers = slides.filter(s=>s.querySelector('.divider'));
  cards.forEach((card,i)=>{
    const targetSlide = dividers[i];
    if(!targetSlide) return;
    card.classList.add('clickable');
    card.setAttribute('role','button');
    card.setAttribute('tabindex','0');
    const go=()=>{ const t=slides.indexOf(targetSlide); if(t>=0) show(t); };
    card.addEventListener('click',go);
    card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
})();

show(0);
</script>
